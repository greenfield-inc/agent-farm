<!doctype html><meta charset="utf-8"><title>Notebook</title>
<style>body{font:15px system-ui,sans-serif;margin:0;background:#f6f6f9}header{display:flex;gap:12px;align-items:center;padding:14px 20px;background:#fff;border-bottom:1px solid #ddd}
main{padding:20px}li{background:#fff;border:1px solid #e3e3ea;border-radius:8px;padding:10px 14px;margin:8px 0;list-style:none}ul{padding:0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:#4f46e5;color:#fff}input{font:inherit;padding:8px;border:1px solid #ccc;border-radius:8px;width:320px}
.toast{position:fixed;top:16px;right:16px;background:#222;color:#fff;padding:10px 14px;border-radius:8px}form.login{max-width:320px;margin:80px auto;display:grid;gap:10px}</style>
<body><div id="root"></div><script>
// A toy product for the harness self-test: a login, a notes list (REST) and
// a live counter over a socket.
const root = document.getElementById('root')
async function boot() {
  const s = await fetch('/api/session').then(r => r.json())
  if (!s.signedIn || location.hash === '#/login') return showLogin()
  const me = await fetch('/api/me').then(r => r.json())
  const notes = await fetch('/api/notes').then(r => r.json())
  root.innerHTML = `<header><b>Notebook</b><span id="who"></span><span id="count"></span></header>
  <main><h1>Notes</h1><input placeholder="Write a note" aria-label="New note"> <button>Save note</button><ul></ul></main>`
  root.querySelector('#who').textContent = me.name
  const item = text => Object.assign(document.createElement('li'), { textContent: text })
  root.querySelector('ul').append(...notes.map(item))
  root.querySelector('button').onclick = async () => {
    const text = root.querySelector('input').value
    const r = await fetch('/api/notes', { method: 'POST', body: JSON.stringify({ text }) }).then(r => r.json())
    if (r.saved === false) return
    root.querySelector('ul').prepend(item(text))
    const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: 'Note saved' })
    document.body.append(t); setTimeout(() => t.remove(), 4000)
  }
  const ws = new WebSocket(location.origin.replace('http', 'ws') + '/ws')
  ws.onopen = () => ws.send(JSON.stringify({ cmd: 'GetCount', id: 1 }))
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.cmd === 'GetCount') document.getElementById('count').textContent = `${m.data.count} notes this week` }
}
function showLogin() {
  root.innerHTML = `<form class="login"><h1>Sign in</h1><input placeholder="Email"><input placeholder="Password" type="password"><button>Log in</button></form>`
  root.querySelector('form').onsubmit = async e => {
    e.preventDefault()
    await fetch('/login', { method: 'POST', body: '{}' })
    location.hash = '#/notes'; boot()
  }
}
boot()
</script></body>
