<!--
  ui-mockup screen-nav snippet. Paste it just before </body> in every .html screen of a round.
  Fill in: the previous and next screen files in the round's order on mockups/index.html (wrapping at the ends),
  the position "n / N", the option and screen name, and the round's anchor on the index.
  Opened alone, the screen shows a small ‹ n / N › bar and ← → move to its neighbours.
  Inside the index viewer the bar hides itself and forwards ← → Esc and swipes to the viewer.
  Its classes start with mn- so they never clash with the screen's own styles.
-->
<nav class="mn-bar" aria-label="Mock-up screens">
  <a class="mn-step" rel="prev" href="checkout-v2-3.html" aria-label="Previous screen">‹</a>
  <a class="mn-home" href="index.html#round-2"><b>2 / 6</b> Option 1 · Checkout, phone</a>
  <a class="mn-step" rel="next" href="checkout-v2-2.html" aria-label="Next screen">›</a>
</nav>
<style>
.mn-bar { position: fixed; right: 12px; bottom: 12px; z-index: 2147483000; display: flex; align-items: center; gap: 4px; max-width: calc(100vw - 24px);
  padding: 4px; border-radius: 999px; background: rgba(20, 24, 21, .88); color: #fff; font: 13px/1.2 -apple-system, system-ui, "Segoe UI", sans-serif;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .25); }
.mn-bar a { color: #fff; text-decoration: none; }
.mn-step { display: grid; place-items: center; min-width: 36px; min-height: 36px; border-radius: 999px; font-size: 20px; }
.mn-step:hover, .mn-home:hover { background: rgba(255, 255, 255, .16); }
.mn-home { padding: 8px 10px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mn-bar a:focus-visible { outline: 2px solid #6fc38d; outline-offset: 1px; }
.mn-bar[hidden] { display: none; }
@media print { .mn-bar { display: none; } }
</style>
<script>
(() => {
  const bar = document.querySelector('.mn-bar');
  const framed = window.self !== window.top;
  if (framed) bar.hidden = true;
  const go = rel => { const a = bar.querySelector('a[rel="' + rel + '"]'); if (a) location.href = a.href; };
  const send = k => window.parent.postMessage({mockupKey: k}, '*');
  addEventListener('keydown', e => {
    if (e.defaultPrevented || e.altKey || e.metaKey || e.ctrlKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (!['ArrowLeft', 'ArrowRight', 'Escape'].includes(e.key)) return;
    if (framed) send(e.key);
    else if (e.key !== 'Escape') go(e.key === 'ArrowRight' ? 'next' : 'prev');
  });
  let x0 = null, y0 = null;
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
    if (framed) send(dx < 0 ? 'ArrowRight' : 'ArrowLeft'); else go(dx < 0 ? 'next' : 'prev');
  });
})();
</script>
