<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace: dark-mode toggle</title>
<style>
:root {
  --bg: #fbfaf6; --panel: #ffffff; --ink: #1d2420; --muted: #5d6861; --line: #dcdfd6;
  --accent: #2f7d4f; --accent-soft: #e4f1e7;
  --warn: #9a5b00; --warn-soft: #fbefd9;
  --bad: #a23a2f; --bad-soft: #f9e4e1;
  --code: #f0f1eb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141815; --panel: #1b211d; --ink: #e7ebe6; --muted: #9aa69e; --line: #2e3731;
    --accent: #6fc38d; --accent-soft: #1e3327;
    --warn: #e5b566; --warn-soft: #352a15;
    --bad: #ef9388; --bad-soft: #3a1f1c;
    --code: #232a25;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 46rem; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 1.75rem; line-height: 1.25; margin: 0 0 .25rem; }
h2 { font-size: 1.25rem; margin: 2rem 0 .5rem; padding-top: .75rem; border-top: 1px solid var(--line); }
h3 { font-size: 1.05rem; margin: 1.25rem 0 .25rem; }
a { color: var(--accent); }
.summary { color: var(--muted); margin: .25rem 0 1rem; }
.meta-line { color: var(--muted); font-size: .85rem; margin: 0; }
.chip { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 10px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); vertical-align: middle; }
.chip.warn { border-color: var(--warn); background: var(--warn-soft); color: var(--warn); }
.chip.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.chip.muted { border-color: var(--line); background: var(--code); color: var(--muted); }
.panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 12px 0; }
.callout { background: var(--panel); border-left: 4px solid var(--accent); padding: 8px 14px; margin: 12px 0; }
.callout.warn { border-left-color: var(--warn); background: var(--warn-soft); }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 8px 0; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
th { color: var(--muted); font-weight: 600; }
code { background: var(--code); padding: 0 4px; border-radius: 4px; font-size: .88em; overflow-wrap: anywhere; }
pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: .85rem; }
img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin: 10px 0; }
summary { cursor: pointer; font-weight: 600; }
ul, ol { padding-left: 1.3rem; }
svg.draw { display: block; width: 100%; height: auto; margin: 16px 0 8px; }
svg.draw text { fill: var(--ink); font: 13px system-ui, -apple-system, sans-serif; }
svg.draw text.small { fill: var(--muted); font-size: 11px; }
svg.draw .box { fill: var(--panel); stroke: var(--line); stroke-width: 1.5; }
svg.draw .hot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
svg.draw .warnbox { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5; }
svg.draw .badbox { fill: var(--bad-soft); stroke: var(--bad); stroke-width: 1.5; }
svg.draw .line { stroke: var(--muted); stroke-width: 1.5; fill: none; }
svg.draw .path { stroke: var(--accent); stroke-width: 2; fill: none; }
svg.draw .dash { stroke-dasharray: 5 4; }
svg.draw .head { fill: var(--muted); }
svg.draw .headhot { fill: var(--accent); }
footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
<h1>Trace: dark-mode toggle <span class="chip muted">not captured</span></h1>
<p class="summary">Fixture: no session captured.</p>
<svg class="draw" viewBox="0 0 640 60" role="img" aria-label="No trace captured">
  <rect class="box dash" x="20" y="10" width="600" height="40" rx="8"/><text x="36" y="35">No conversation was captured for this bundle.</text>
</svg>
<div class="callout warn">This bundle is a test fixture for the document checker. It was written by hand, not produced by a recorded session, so there is nothing to show here.</div>
<footer><a href="index.html">Back to the brief</a></footer>
</main>
</body>
</html>
